<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --secondary-text: #666666;
            --link-color: #0070f3;
            --accent-color: #fafafa;
            --header-bg: rgba(255, 255, 255, 0.8);
            --border-color: #eaeaea;
            --tag-bg: #f0f2f5;
            --tag-text: #1d9bf0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--header-bg);
            backdrop-filter: saturate(180%) blur(5px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--secondary-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-color);
        }

        .container {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        #content {
            margin-top: 2rem;
        }

        h1, h2, h3 {
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.75rem; margin-top: 3.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }

        p { margin-bottom: 1.5rem; color: #333; }

        footer {
            margin-top: 8rem;
            padding: 4rem 10%;
            text-align: center;
            font-size: 0.9rem;
            color: var(--secondary-text);
            border-top: 1px solid var(--border-color);
            background-color: var(--accent-color);
        }

        /* Markdown Styling */
        #content blockquote {
            border-left: 4px solid var(--link-color);
            margin: 2rem 0;
            padding: 0.5rem 1.5rem;
            background-color: var(--accent-color);
            font-style: italic;
            color: var(--secondary-text);
        }

        #content code {
            background-color: #f3f3f3;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.85em;
        }

        #content img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Tag Styling */
        .tag {
            display: inline-block;
            background-color: var(--tag-bg);
            color: var(--secondary-text);
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
        }

        .tag:hover {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        /* CV Layout */
        .cv-header-grid {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 3rem;
            margin-bottom: 4rem;
            align-items: center;
        }

        .cv-info-header {
            text-align: left;
        }

        .cv-info-header h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .cv-info-header p:nth-of-type(1) {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--secondary-text);
        }

        .cv-photo {
            width: 100%;
            aspect-ratio: 1080 / 1440;
            background-color: #f0f0f0;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .cv-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Publication Styling */
        .pub-item {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 2.5rem;
            margin-bottom: 4rem;
            padding-bottom: 2rem;
        }

        .pub-media {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: var(--accent-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .pub-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pub-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            justify-content: center;
        }

        .pub-title {
            font-size: 1.0rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.3;
            margin-bottom: 0.1rem;
        }

        .pub-authors { font-size: 0.9rem; color: var(--secondary-text); }
        .pub-venue { font-size: 0.9rem; font-weight: 600; color: var(--secondary-text); }

        .pub-links {
            margin-top: 0.4rem;
            display: flex;
            gap: 0.6rem;
        }

        .pub-links a {
            text-decoration: none;
            color: var(--text-color);
            padding: 0.2rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .pub-links a:hover {
            background-color: var(--text-color);
            color: white;
        }

        .pub-abstract {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: var(--secondary-text);
            line-height: 1.5;
            font-family: 'Lora', serif;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            padding: 0.5rem;
            background-color: var(--accent-color);
            border-radius: 30px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .lang-switch a {
            color: var(--secondary-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .lang-switch a.active {
            background-color: white;
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        @media (max-width: 850px) {
            .pub-item { grid-template-columns: 1fr; }
            .pub-media { max-width: 100%; aspect-ratio: 16/9; }
            .cv-header-grid { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .cv-photo { width: 200px; order: -1; }
            header { padding: 1.5rem 5%; }
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 1.5rem; }
            nav { gap: 1.5rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="{{ site.baseurl }}/">Yubo Dong's Page</a>
        <nav>
            <a href="{{ site.baseurl }}/intro/cv-en/">CV</a>
            <a href="{{ site.baseurl }}/notes/">Notes</a>
        </nav>
    </header>

    <div class="container">
        <main id="content">
            {{ content }}
        </main>
    </div>

    <footer>
        <p>&copy; 2026. Built with 🚀 Gemini CLI. Minimalism & Research.</p>
    </footer>
</body>
</html>
